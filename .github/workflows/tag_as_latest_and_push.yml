name: Tag Images as latest
run-name: Tag ${{ github.ref_name }} as latest

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/j-toscani/onog

on:
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  retag-to-latest:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [website, api, bot]
    steps:
      - name: Print Tagging Info
        run: |
          echo "Tagging ${{ matrix.app }} image for tag: ${{ github.ref_name }}"
          echo "Version: ${{ needs.extract-version.outputs.version }}"

      - name: Docker log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Pull and retag ${{ matrix.app }} as latest and version
        run: |
          IMAGE="${{ env.IMAGE_PREFIX }}-${{ matrix.app }}"
          VERSION="${{ needs.extract-version.outputs.version }}"

          if docker pull "${IMAGE}:${VERSION}-staging" 2>/dev/null; then
            docker tag "${IMAGE}:${VERSION}-staging" "${IMAGE}:${VERSION}"
            docker tag "${IMAGE}:${VERSION}-staging" "${IMAGE}:latest"
            docker push "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:latest"
            echo "✅ ${{ matrix.app }} getaggt: ${VERSION}, latest"
          else
            echo "⚠️ Kein Staging-Image für ${{ matrix.app }} gefunden, überspringe"
          fi