name: Tag Image as latest
run-name: Tag ${{ github.ref_name }} as latest

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/j-toscani/oldnerds-playing-older-games

on:
  workflow_dispatch:

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          TAG_NAME=${{ github.ref_name }}

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Version: $VERSION"
          echo "Tag: $TAG_NAME"

  retag-to-latest:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Print Tagging Info
        run: |
          echo "Tagging image for tag: ${{ github.ref_name }}"
          echo "Version: ${{ needs.extract-version.outputs.version }}"

      - name: Docker log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Pull and retag as latest and version
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}-staging
          docker tag ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}-staging ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}
          docker tag ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}-staging ${{ env.IMAGE_NAME }}:latest
          docker push --all-tags ${{ env.IMAGE_NAME }}