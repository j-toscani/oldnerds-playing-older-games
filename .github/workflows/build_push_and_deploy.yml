name: Build and Push Images
run-name: Build images for ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/j-toscani/onog
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.changes.outputs.website }}
      api: ${{ steps.changes.outputs.api }}
      bot: ${{ steps.changes.outputs.bot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Letzten Tag vor dem aktuellen finden
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "Kein vorheriger Tag gefunden — alle Services werden gebaut"
            echo "website=true" >> $GITHUB_OUTPUT
            echo "api=true" >> $GITHUB_OUTPUT
            echo "bot=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Vergleiche $PREV_TAG mit HEAD"

          CHANGED=$(git diff --name-only "$PREV_TAG" HEAD)
          echo "Geänderte Dateien:"
          echo "$CHANGED"

          # packages/shared Änderungen triggern alle Builds
          if echo "$CHANGED" | grep -q "^packages/shared/"; then
            echo "packages/shared geändert — alle Services werden gebaut"
            echo "website=true" >> $GITHUB_OUTPUT
            echo "api=true" >> $GITHUB_OUTPUT
            echo "bot=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Pro Service prüfen
          echo "$CHANGED" | grep -q "^apps/website/" && echo "website=true" >> $GITHUB_OUTPUT || echo "website=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^apps/api/" && echo "api=true" >> $GITHUB_OUTPUT || echo "api=false" >> $GITHUB_OUTPUT
          echo "$CHANGED" | grep -q "^apps/bot/" && echo "bot=true" >> $GITHUB_OUTPUT || echo "bot=false" >> $GITHUB_OUTPUT

  build-and-push:
    needs: [extract-version, detect-changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: website
            turbo_package: "@onog/website"
            app_dir: apps/website
            port: "3000"
            build_output: dist
            entrypoint: dist/server/index.mjs
            changed: ${{ needs.detect-changes.outputs.website }}
            deploy_hook_secret: ONOG_WEBSITE_DEPLOY_HOOK_URL
          - app: api
            turbo_package: "@onog/api"
            app_dir: apps/api
            port: "5000"
            build_output: dist
            entrypoint: dist/index.js
            changed: ${{ needs.detect-changes.outputs.api }}
            deploy_hook_secret: ONOG_API_DEPLOY_HOOK_URL
          - app: bot
            turbo_package: "@onog/bot"
            app_dir: apps/bot
            port: "4000"
            build_output: dist
            entrypoint: dist/index.js
            changed: ${{ needs.detect-changes.outputs.bot }}
            deploy_hook_secret: ONOG_BOT_DEPLOY_HOOK_URL
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }}
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            TURBO_PACKAGE=${{ matrix.turbo_package }}
            APP_DIR=${{ matrix.app_dir }}
            PORT=${{ matrix.port }}
            BUILD_OUTPUT=${{ matrix.build_output }}
            ENTRYPOINT=${{ matrix.entrypoint }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.extract-version.outputs.version }}-staging

      - name: Re-tag unchanged ${{ matrix.app }}
        if: matrix.changed != 'true'
        run: |
          echo "⏩ ${{ matrix.app }} unverändert — re-tag auf neue Version"
          docker pull ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging || echo "⚠️ Kein bestehendes Image gefunden, überspringe"
          if docker image inspect ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging > /dev/null 2>&1; then
            docker tag ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.extract-version.outputs.version }}-staging
            docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.extract-version.outputs.version }}-staging
          fi

      - name: Deploy ${{ matrix.app }} to Staging
        if: matrix.changed == 'true'
        run: |
          HOOK_URL="${{ secrets[matrix.deploy_hook_secret] }}"
          if [ -n "$HOOK_URL" ]; then
            curl -sf -X POST "$HOOK_URL" \
              --max-time 30 \
              --retry 3 \
              --retry-delay 5
            echo "✅ ${{ matrix.app }} deployed"
          else
            echo "⚠️ Kein Deploy-Hook für ${{ matrix.app }} konfiguriert"
          fi
