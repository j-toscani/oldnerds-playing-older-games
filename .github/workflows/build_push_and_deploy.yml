name: Build and Push Image
run-name: Create image for ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/j-toscani/oldnerds-playing-older-games
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Extract version from tag
        id: tag
        run: |
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')
          TAG_NAME=${{ github.ref_name }}

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "Version: $VERSION"
          echo "Tag: $TAG_NAME"

  build-and-push:
    needs: extract-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:${{ needs.extract-version.outputs.version }}-staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer service update
        run: |
          curl -sf -X POST "${{ secrets.ONOG_WEBSITE_DEPLOY_HOOK_URL }}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5