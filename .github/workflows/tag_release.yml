name: Tag Release
run-name: Tag new version from ${{ github.ref_name }}

on:
  push:
    branches:
      - main

jobs:
  tag:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    name: Bump version & push tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Determine version bump
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          dry_run: true
          default_bump: patch

      - name: Setup Bun
        if: steps.version.outputs.release_type != ''
        uses: oven-sh/setup-bun@v2

      - name: Update package.json versions
        if: steps.version.outputs.release_type != ''
        run: |
          for app in website api bot; do
            npm version ${{ steps.version.outputs.new_version }} --no-git-tag-version --prefix apps/$app
          done

      - name: Commit, tag, and push
        if: steps.version.outputs.release_type != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/website/package.json apps/api/package.json apps/bot/package.json
          git commit -m "chore(release): v${{ steps.version.outputs.new_version }}"
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin main --tags
